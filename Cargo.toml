[workspace]
resolver = "2"
members = [
    "platform",
    "shared/logging",
    "shared/storage",
    "shared/indexing",
    "shared/encryption",
    "shared/search",
    "shared/updater",
    "shared/plugins",
    "shared/telemetry",
    "shared/settings",
    "apps/universal-log-viewer",
    "apps/devops-secret-vault",
    "apps/ai-file-explorer",
    "tests",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Offline Suite Core Team"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/organization/offline-apps-monorepo"

[workspace.dependencies]
# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Concurrency & Async
tokio = { version = "1.40", features = ["full"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Storage & Embedded Database
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"

# Cryptography & Security
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
blake3 = "1.5"

# Search & Indexing
tantivy = "0.22"
walkdir = "2.5"
memchr = "2.7"
regex = "1.11"

# Utilities & System
tempfile = "3.12"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal workspace crates
platform-common = { path = "platform" }
shared-logging = { path = "shared/logging" }
shared-storage = { path = "shared/storage" }
shared-indexing = { path = "shared/indexing" }
shared-encryption = { path = "shared/encryption" }
shared-search = { path = "shared/search" }
shared-updater = { path = "shared/updater" }
shared-plugins = { path = "shared/plugins" }
shared-telemetry = { path = "shared/telemetry" }
shared-settings = { path = "shared/settings" }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
