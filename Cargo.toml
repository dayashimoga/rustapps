[workspace]
resolver = "2"
members = [
    "platform",
    "shared/logging",
    "shared/storage",
    "shared/indexing",
    "shared/encryption",
    "shared/search",
    "shared/updater",
    "shared/plugins",
    "shared/telemetry",
    "shared/settings",
    "shared/licensing",
    "shared/model-hub",
    "shared/ai-core",
    "shared/media-core",
    "apps/universal-log-viewer",
    "apps/devops-secret-vault",
    "apps/ai-file-explorer",
    "apps/universal-live-translator",
    "apps/pro-av-editor",
    "apps/personal-knowledge-graph",
    "apps/api-protocol-studio",
    "apps/parquet-analytics-workbench",
    "apps/dfir-triage-kit",
    "apps/screen-recorder-studio",
    "apps/signal-telemetry-oscilloscope",
    "apps/audio-mastering-studio",
    "apps/qr-code-studio",
    "apps/clean-room-redactor",
    "apps/local-data-synthesizer",
    "apps/sbom-supply-chain-auditor",
    "apps/offline-pcap-workbench",
    "apps/crypto-pki-ca-studio",
    "apps/local-rag-contract-auditor",
    "apps/sql-migration-diff-studio",
    "apps/privacy-media-sanitizer",
    "apps/modbus-can-industrial-debugger",
    "apps/markdown-publishing-press",
    "tools/license-signer",
    "tests",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Offline Suite Core Team"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/organization/offline-apps-monorepo"

[workspace.dependencies]
# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Concurrency & Async
tokio = { version = "1.40", features = ["full"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Storage & Embedded Database
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"

# Cryptography & Security
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
blake3 = "1.5"

# Search & Indexing
tantivy = "0.22"
walkdir = "2.5"
memchr = "2.7"
regex = "1.11"

# Utilities & System
tempfile = "3.12"
uuid = { version = "1.10", features = ["v4"] }
criterion = { version = "0.5", features = ["html_reports"] }
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

# Internal workspace crates
platform-common = { path = "platform" }
shared-logging = { path = "shared/logging" }
shared-storage = { path = "shared/storage" }
shared-indexing = { path = "shared/indexing" }
shared-encryption = { path = "shared/encryption" }
shared-search = { path = "shared/search" }
shared-updater = { path = "shared/updater" }
shared-plugins = { path = "shared/plugins" }
shared-telemetry = { path = "shared/telemetry" }
shared-settings = { path = "shared/settings" }
shared-licensing = { path = "shared/licensing" }
shared-model-hub = { path = "shared/model-hub" }
shared-ai-core = { path = "shared/ai-core" }
shared-media-core = { path = "shared/media-core" }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
