[package]
name = "modbus-can-industrial-debugger"
version = "0.1.0"
edition = "2021"
authors = ["Offline Apps Team"]
description = "Air-Gapped Industrial Fieldbus Protocol Debugger for Modbus RTU/TCP, CAN 2.0B / CAN-FD & Industrial Security Anomaly Detection"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

shared-licensing = { path = "../../shared/licensing" }
platform-common = { path = "../../platform" }

[lib]
name = "modbus_can_industrial_debugger"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "modbus-can-industrial-debugger"
path = "src/main.rs"
