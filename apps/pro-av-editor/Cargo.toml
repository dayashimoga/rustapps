[package]
name = "pro-av-editor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Professional Audio & Video Editor: 100% offline multi-track timeline, GPU/SIMD compositor, color grading & AI auto-editing"

[lib]
name = "pave_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pro-av-editor"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }

# Internal workspace crates
platform-common = { path = "../../platform" }
shared-logging = { path = "../../shared/logging" }
shared-storage = { path = "../../shared/storage" }
shared-settings = { path = "../../shared/settings" }
shared-telemetry = { path = "../../shared/telemetry" }
shared-ai-core = { path = "../../shared/ai-core" }
shared-media-core = { path = "../../shared/media-core" }
shared-licensing = { path = "../../shared/licensing" }
shared-model-hub = { path = "../../shared/model-hub" }

[dev-dependencies]
tempfile = { workspace = true }
shared-licensing = { path = "../../shared/licensing", features = ["signing"] }

