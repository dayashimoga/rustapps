[package]
name = "sbom-supply-chain-auditor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Air-Gapped SBOM & Supply-Chain Auditor — 100% Offline CycloneDX/SPDX Analysis, Copyleft Risk Detection, Vulnerability Matching & NTIA Compliance Verification"

[lib]
name = "sbom_supply_chain_auditor"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sbom-supply-chain-auditor"
