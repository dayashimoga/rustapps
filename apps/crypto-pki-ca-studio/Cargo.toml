[package]
name = "crypto-pki-ca-studio"
version = "0.1.0"
edition = "2021"
authors = ["Offline Apps Team"]
description = "Visual Air-Gapped X.509 PKI Studio with Shamir M-of-N Root Key Ceremony, CSR Signer & CRL Manager"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }

shared-licensing = { path = "../../shared/licensing" }
platform-common = { path = "../../platform" }

[lib]
name = "crypto_pki_ca_studio"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "crypto-pki-ca-studio"
path = "src/main.rs"
