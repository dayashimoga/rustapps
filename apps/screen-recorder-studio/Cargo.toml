[package]
name = "screen-recorder-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Offline AI Screen Recorder & Interactive Tutorial Builder — 100% Offline Capture, Auto-Zoom & Subtitles"

[lib]
name = "screen_recorder_studio"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "screen-recorder-studio"
path = "src/main.rs"

[dependencies]
# Workspace crates
platform-common.workspace = true
shared-storage.workspace = true
shared-telemetry.workspace = true
shared-licensing = { path = "../../shared/licensing" }
shared-media-core.workspace = true

# Storage & Serialization
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

# Utilities
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
