[package]
name = "devops-secret-vault"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DevOps Secret Vault: Ultra-fast, lightweight, offline-first encrypted secret manager"

[lib]
name = "vault_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "devops-secret-vault"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
aes-gcm = { workspace = true }
argon2 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
tantivy = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }

# Workspace dependencies
platform-common = { workspace = true }
shared-logging = { workspace = true }
shared-storage = { workspace = true }
shared-encryption = { workspace = true }
shared-search = { workspace = true }
shared-settings = { workspace = true }
shared-telemetry = { workspace = true }
shared-licensing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
shared-licensing = { path = "../../shared/licensing", features = ["signing"] }
