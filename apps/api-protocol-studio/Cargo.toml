# Internal workspace crates
platform-common = { path = "../../platform" }
shared-logging = { path = "../../shared/logging" }
shared-storage = { path = "../../shared/storage" }
shared-encryption = { path = "../../shared/encryption" }
shared-settings = { path = "../../shared/settings" }
shared-telemetry = { path = "../../shared/telemetry" }
shared-plugins = { path = "../../shared/plugins" }
shared-licensing = { path = "../../shared/licensing" }

[dev-dependencies]
tempfile.workspace = true

