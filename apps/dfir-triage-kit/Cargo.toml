[package]
name = "dfir-triage-kit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Offline Digital Forensics & Incident Response (DFIR) Triage Kit — 100% Offline Host Forensics & Incident Analysis"

[lib]
name = "dfir_triage_kit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dfir-triage-kit"
path = "src/main.rs"

[dependencies]
# Workspace crates
platform-common.workspace = true
shared-storage.workspace = true
shared-telemetry.workspace = true
shared-licensing = { path = "../../shared/licensing" }
shared-encryption.workspace = true

# Storage & Serialization
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

# Cryptography & Hashing
blake3.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true

# Filesystem & Pattern Matching
walkdir.workspace = true
regex.workspace = true
flate2.workspace = true

# Utilities
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

