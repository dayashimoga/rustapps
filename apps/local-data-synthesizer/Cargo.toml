[package]
name = "local-data-synthesizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Offline Local Synthetic Data & Anonymization Studio — 100% Offline Schema Inference, Foreign Key Preserving Subsetting, Distribution Cloning & Differential Privacy Metrics"

[lib]
name = "local_data_synthesizer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "local-data-synthesizer"
path = "src/main.rs"

[dependencies]
# Workspace crates
platform-common.workspace = true
shared-storage.workspace = true
shared-encryption.workspace = true
shared-telemetry.workspace = true
shared-licensing = { path = "../../shared/licensing" }

# Storage, Compression & Serialization
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
csv.workspace = true

# Cryptography & Security
aes-gcm.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
blake3.workspace = true
rand.workspace = true
zeroize.workspace = true

# Utilities
thiserror.workspace = true
uuid.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true
