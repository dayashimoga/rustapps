[package]
name = "universal-live-translator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Universal Live Translator: 100% offline real-time voice, text, conversation, camera & document translator"

[lib]
name = "ult_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "universal-live-translator"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }

# Internal workspace crates
platform-common = { path = "../../platform" }
shared-logging = { path = "../../shared/logging" }
shared-storage = { path = "../../shared/storage" }
shared-settings = { path = "../../shared/settings" }
shared-telemetry = { path = "../../shared/telemetry" }
shared-ai-core = { path = "../../shared/ai-core" }
shared-media-core = { path = "../../shared/media-core" }
shared-licensing = { path = "../../shared/licensing" }
shared-model-hub = { path = "../../shared/model-hub" }

[dev-dependencies]
tempfile = { workspace = true }

