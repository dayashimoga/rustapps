[package]
name = "sql-migration-diff-studio"
version = "0.1.0"
edition = "2021"
authors = ["Offline Apps Team"]
description = "Air-Gapped Visual Database Schema Differ, Safe Migration Generator & Backward Compatibility Linter"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
regex = "1.10"

shared-licensing = { path = "../../shared/licensing" }
platform-common = { path = "../../platform" }

[lib]
name = "sql_migration_diff_studio"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "sql-migration-diff-studio"
path = "src/main.rs"
