[package]
name = "clean-room-redactor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Offline Clean-Room Document Redactor — 100% Offline Deep Stream Burnout, PII/PHI Detection, Bates Numbering & Ed25519 Cryptographic Sanitization Certificates"

[lib]
name = "clean_room_redactor"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "clean-room-redactor"
path = "src/main.rs"

[dependencies]
