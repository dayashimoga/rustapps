[package]
name = "universal-log-viewer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "universal_log_viewer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "universal-log-viewer"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
tokio.workspace = true
tracing.workspace = true
memmap2.workspace = true
memchr.workspace = true
regex.workspace = true
rusqlite.workspace = true

# Internal workspace crates
platform-common = { path = "../../platform" }
shared-logging = { path = "../../shared/logging" }
shared-storage = { path = "../../shared/storage" }
shared-search = { path = "../../shared/search" }
shared-settings = { path = "../../shared/settings" }
shared-telemetry = { path = "../../shared/telemetry" }
shared-plugins = { path = "../../shared/plugins" }
shared-indexing = { path = "../../shared/indexing" }
shared-licensing = { path = "../../shared/licensing" }

[dev-dependencies]
tempfile.workspace = true
