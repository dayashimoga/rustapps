name: Automated Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-matrix:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: windows-arm64
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64
            use_cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: macos-x64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libappindicator3-dev

      - name: Install cross-rs (for containerized cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Run Full Test Suite (Standard)
        if: "!matrix.use_cross"
        run: cargo test --workspace --all-targets --release

      - name: Build Release Binaries (Standard)
        if: "!matrix.use_cross"
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build Release Binaries (Cross)
        if: matrix.use_cross
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Compute Checksums
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/* dist/ 2>/dev/null || true
          cd dist
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: Upload Packaged Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: dist/
          retention-days: 90

  publish-release:
    name: Publish GitHub Release & SBOM
    needs: release-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx

      - name: Generate Release SBOM
        run: |
          cargo cyclonedx --format json --output-pattern "sbom-cyclonedx.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-*/*
            sbom-cyclonedx.json
          draft: false
          prerelease: false
          generate_release_notes: true
