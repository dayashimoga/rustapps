name: Release AI File Explorer

on:
  push:
    tags:
      - 'ai-file-explorer-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  release:
    uses: ./.github/workflows/reusable-app-release.yml
    with:
      app_name: 'ai-file-explorer'
      app_display_name: 'AI File Explorer'
      version: ${{ inputs.version || github.ref_name }}

