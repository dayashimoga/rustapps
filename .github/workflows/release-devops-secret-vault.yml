name: Release DevOps Secret Vault

on:
  push:
    tags:
      - 'devops-secret-vault-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  release:
    uses: ./.github/workflows/reusable-app-release.yml
    with:
      app_name: 'devops-secret-vault'
      app_display_name: 'DevOps Secret Vault'
      version: ${{ inputs.version || github.ref_name }}

