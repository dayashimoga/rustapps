name: Criterion Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  benchmark:
    name: Run Performance Benchmarks & Detect Regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev

      - name: Run Criterion Benchmarks
        run: cargo bench --workspace -- --save-baseline current

      - name: Compare Against Historical Baseline
        run: |
          # If baseline exists, verify no statistical regression > 5%
          if [ -d "benchmarks/baseline" ]; then
            cargo bench --workspace -- --baseline baseline
          fi

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: criterion-benchmark-reports
          path: target/criterion/
          retention-days: 90
