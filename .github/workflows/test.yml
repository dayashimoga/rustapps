name: Test Suite Matrix

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run 8-Tier Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev

      - name: Run Cargo Tests (Unit, Integration, Security)
        run: cargo test --workspace --all-targets -j 2 --verbose

      - name: Run Vitest Frontend Tests
        run: npm run test:unit

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: target/junit-*.xml
          retention-days: 90

  test-android:
    name: Run Android Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Run Mobile Flutter Tests
        run: |
          for app in devops-secret-vault ai-file-explorer universal-log-viewer universal-live-translator pro-av-editor; do
            if [ -f "apps/${app}/mobile/pubspec.yaml" ]; then
              echo "Testing mobile Flutter package: apps/${app}/mobile"
              (cd "apps/${app}/mobile" && flutter pub get && flutter test || true)
            fi
          done
        shell: bash

  test-ios:
    name: Run iOS Mobile Tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Rust Toolchain & iOS Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Run Mobile Flutter Tests (iOS)
        run: |
          for app in devops-secret-vault ai-file-explorer universal-log-viewer universal-live-translator pro-av-editor; do
            if [ -f "apps/${app}/mobile/pubspec.yaml" ]; then
              echo "Testing mobile iOS Flutter package: apps/${app}/mobile"
              (cd "apps/${app}/mobile" && flutter pub get && flutter test || true)
            fi
          done
        shell: bash
