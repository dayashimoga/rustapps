name: Build Matrix

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:
    inputs:
      app:
        description: 'Select application to build (or "all" for all 5 applications)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - devops-secret-vault
          - ai-file-explorer
          - universal-log-viewer
          - universal-live-translator
          - pro-av-editor
          - personal-knowledge-graph
          - api-protocol-studio
          - parquet-analytics-workbench
          - dfir-triage-kit
          - screen-recorder-studio
          - signal-telemetry-oscilloscope
          - audio-mastering-studio
      platform:
        description: 'Select target platform (or "all" for all 5 platforms)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - android
          - ios

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.app }}" != "all" ]; then
            echo "apps=[\"${{ inputs.app }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo 'apps=["devops-secret-vault", "ai-file-explorer", "universal-log-viewer", "universal-live-translator", "pro-av-editor", "personal-knowledge-graph", "api-protocol-studio", "parquet-analytics-workbench", "dfir-triage-kit", "screen-recorder-studio", "signal-telemetry-oscilloscope", "audio-mastering-studio"]' >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows (${{ matrix.app }})
    needs: setup
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.app }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.app }}-
            ${{ runner.os }}-cargo-build-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Svelte Desktop UI
        shell: bash
        run: |
          if [ -d "apps/${{ matrix.app }}/ui" ]; then
            echo "Building UI for ${{ matrix.app }}..."
            (cd "apps/${{ matrix.app }}/ui" && (npm ci || npm install) && npm run build)
          fi

      - name: Clippy Linter (${{ matrix.app }})
        run: cargo clippy -p ${{ matrix.app }} --all-targets -- -D warnings

      - name: Compile Release Binary
        run: cargo build --release -p ${{ matrix.app }}

      - name: Self-Test Verification
        shell: bash
        run: |
          bin_path="target/release/${{ matrix.app }}.exe"
          if [ -f "${bin_path}" ]; then
            echo "Executing --self-test on ${bin_path}..."
            "${bin_path}" --self-test
          fi

      - name: Generate CycloneDX SBOM (${{ matrix.app }})
        shell: bash
        run: |
          mkdir -p "dist-packages/${{ matrix.app }}"
          powershell -ExecutionPolicy Bypass -File scripts/generate-sbom.ps1 -AppName "${{ matrix.app }}" -OutputDir "dist-packages/${{ matrix.app }}"

      - name: Package Standalone Windows ZIP Bundle & WiX Manifest
        shell: bash
        run: |
          mkdir -p "dist-packages/${{ matrix.app }}"
          stage_dir="stage_${{ matrix.app }}"
          mkdir -p "${stage_dir}"
          cp "target/release/${{ matrix.app }}.exe" "${stage_dir}/"
          cp "target/release/${{ matrix.app }}.exe" "dist-packages/${{ matrix.app }}/"
          touch "${stage_dir}/portable.flag"
          [ -f "README.md" ] && cp "README.md" "${stage_dir}/"
          [ -f "LICENSE" ] && cp "LICENSE" "${stage_dir}/"
          [ -f "dist-packages/${{ matrix.app }}/${{ matrix.app }}-sbom.json" ] && cp "dist-packages/${{ matrix.app }}/${{ matrix.app }}-sbom.json" "${stage_dir}/"
          
          # WiX Manifest
          cat > "dist-packages/${{ matrix.app }}/${{ matrix.app }}-0.1.0.wxs" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
              <Product Id="*" Name="${{ matrix.app }}" Language="1033" Version="0.1.0" Manufacturer="OfflineApps" UpgradeCode="{A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C5D}">
                  <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
                  <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
                  <MediaTemplate EmbedCab="yes" />
                  <Feature Id="ProductFeature" Title="${{ matrix.app }}" Level="1">
                      <ComponentRef Id="MainExecutable" />
                  </Feature>
                  <Directory Id="TARGETDIR" Name="SourceDir">
                      <Directory Id="ProgramFilesFolder">
                          <Directory Id="INSTALLFOLDER" Name="${{ matrix.app }}">
                              <Component Id="MainExecutable" Guid="*">
                                  <File Id="AppExe" Source="${{ matrix.app }}.exe" KeyPath="yes" />
                              </Component>
                          </Directory>
                      </Directory>
                  </Directory>
              </Product>
          </Wix>
          EOF

          zip_path="dist-packages/${{ matrix.app }}/${{ matrix.app }}-0.1.0-windows-x64.zip"
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip "${zip_path}" "./${stage_dir}/*"
          elif command -v powershell >/dev/null 2>&1; then
            powershell -Command "Compress-Archive -Path '${stage_dir}/*' -DestinationPath '${zip_path}' -Force"
          fi
          rm -rf "${stage_dir}"

          # Compute SHA-256 for all artifacts
          powershell -Command "Get-ChildItem -Path 'dist-packages/${{ matrix.app }}' -File | Where-Object { -not \$_.Name.EndsWith('.sha256') } | ForEach-Object { \$hash = (Get-FileHash -Path \$_.FullName -Algorithm SHA256).Hash.ToLower(); \"\$hash  \$(\$_.Name)\" | Set-Content \"\$(\$_.FullName).sha256\" -Encoding ASCII }"

      - name: Upload ${{ matrix.app }} Windows Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-windows
          path: dist-packages/${{ matrix.app }}/
          retention-days: 90

  build-linux:
    name: Build Linux (${{ matrix.app }})
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.app }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.app }}-
            ${{ runner.os }}-cargo-build-

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libappindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Svelte Desktop UI
        shell: bash
        run: |
          if [ -d "apps/${{ matrix.app }}/ui" ]; then
            echo "Building UI for ${{ matrix.app }}..."
            (cd "apps/${{ matrix.app }}/ui" && (npm ci || npm install) && npm run build)
          fi

      - name: Clippy Linter (${{ matrix.app }})
        run: cargo clippy -p ${{ matrix.app }} --all-targets -- -D warnings

      - name: Compile Release Binary
        run: cargo build --release -p ${{ matrix.app }}

      - name: Self-Test Verification
        shell: bash
        run: |
          bin_path="target/release/${{ matrix.app }}"
          if [ -f "${bin_path}" ]; then
            chmod +x "${bin_path}"
            echo "Executing --self-test on ${bin_path}..."
            "${bin_path}" --self-test
          fi

      - name: Generate CycloneDX SBOM (${{ matrix.app }})
        shell: bash
        run: |
          mkdir -p "dist-packages/${{ matrix.app }}"
          bash scripts/generate-sbom.sh "${{ matrix.app }}" "dist-packages/${{ matrix.app }}"

      - name: Package Standalone Linux Distribution Bundles
        shell: bash
        run: |
          mkdir -p "dist-packages/${{ matrix.app }}"
          abs_pkg_dir="$(cd "dist-packages/${{ matrix.app }}" && pwd)"
          abs_zip="${abs_pkg_dir}/${{ matrix.app }}-0.1.0-linux-x64.zip"
          stage_dir="stage_${{ matrix.app }}"
          mkdir -p "${stage_dir}"
          cp "target/release/${{ matrix.app }}" "${stage_dir}/"
          cp "target/release/${{ matrix.app }}" "${abs_pkg_dir}/"
          touch "${stage_dir}/portable.flag"
          [ -f "README.md" ] && cp "README.md" "${stage_dir}/"
          [ -f "LICENSE" ] && cp "LICENSE" "${stage_dir}/"
          [ -f "${abs_pkg_dir}/${{ matrix.app }}-sbom.json" ] && cp "${abs_pkg_dir}/${{ matrix.app }}-sbom.json" "${stage_dir}/"
          if command -v zip >/dev/null 2>&1; then
            (cd "${stage_dir}" && zip -r "${abs_zip}" .)
          fi
          
          # Debian layout packaging
          deb_stage="deb_stage_${{ matrix.app }}"
          mkdir -p "${deb_stage}/DEBIAN" "${deb_stage}/usr/bin"
          cp "target/release/${{ matrix.app }}" "${deb_stage}/usr/bin/${{ matrix.app }}"
          chmod 755 "${deb_stage}/usr/bin/${{ matrix.app }}"
          cat <<EOF > "${deb_stage}/DEBIAN/control"
          Package: ${{ matrix.app }}
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Offline Apps Engineering <maintainers@offlineapps.local>
          Description: 100% Offline Standalone Application: ${{ matrix.app }}
          EOF
          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb --build "${deb_stage}" "${abs_pkg_dir}/${{ matrix.app }}_0.1.0_amd64.deb" || true
          fi
          rm -rf "${deb_stage}" "${stage_dir}"

          # Compute SHA-256 for all artifacts
          cd "${abs_pkg_dir}"
          for f in *; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Upload ${{ matrix.app }} Linux Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-linux
          path: dist-packages/${{ matrix.app }}/
          retention-days: 90

  build-macos:
    name: Build macOS (${{ matrix.app }})
    needs: setup
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & macOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.app }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.app }}-
            ${{ runner.os }}-cargo-build-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Svelte Desktop UI
        shell: bash
        run: |
          if [ -d "apps/${{ matrix.app }}/ui" ]; then
            echo "Building UI for ${{ matrix.app }}..."
            (cd "apps/${{ matrix.app }}/ui" && (npm ci || npm install) && npm run build)
          fi

      - name: Clippy Linter (${{ matrix.app }})
        run: cargo clippy -p ${{ matrix.app }} --all-targets -- -D warnings

      - name: Compile Universal macOS Binaries (Apple Silicon & Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin -p ${{ matrix.app }}
          cargo build --release --target x86_64-apple-darwin -p ${{ matrix.app }}
          mkdir -p target/universal
          lipo -create -output "target/universal/${{ matrix.app }}" \
            "target/aarch64-apple-darwin/release/${{ matrix.app }}" \
            "target/x86_64-apple-darwin/release/${{ matrix.app }}"

      - name: Self-Test Verification
        shell: bash
        run: |
          bin_path="target/universal/${{ matrix.app }}"
          if [ -f "${bin_path}" ]; then
            chmod +x "${bin_path}"
            echo "Executing --self-test on ${bin_path}..."
            "${bin_path}" --self-test
          fi

      - name: Generate CycloneDX SBOM (${{ matrix.app }})
        shell: bash
        run: |
          mkdir -p "dist-packages/${{ matrix.app }}"
          bash scripts/generate-sbom.sh "${{ matrix.app }}" "dist-packages/${{ matrix.app }}"

      - name: Package Standalone macOS Universal Bundles
        shell: bash
        run: |
          mkdir -p "dist-packages/${{ matrix.app }}"
          abs_pkg_dir="$(cd "dist-packages/${{ matrix.app }}" && pwd)"
          abs_zip="${abs_pkg_dir}/${{ matrix.app }}-0.1.0-macos-universal.zip"
          stage_dir="stage_${{ matrix.app }}"
          mkdir -p "${stage_dir}"
          cp "target/universal/${{ matrix.app }}" "${stage_dir}/"
          touch "${stage_dir}/portable.flag"
          [ -f "README.md" ] && cp "README.md" "${stage_dir}/"
          [ -f "LICENSE" ] && cp "LICENSE" "${stage_dir}/"
          [ -f "${abs_pkg_dir}/${{ matrix.app }}-sbom.json" ] && cp "${abs_pkg_dir}/${{ matrix.app }}-sbom.json" "${stage_dir}/"
          if command -v zip >/dev/null 2>&1; then
            (cd "${stage_dir}" && zip -r "${abs_zip}" .)
          fi

          # Assemble .app bundle layout
          app_bundle="${abs_pkg_dir}/${{ matrix.app }}.app"
          mkdir -p "${app_bundle}/Contents/MacOS" "${app_bundle}/Contents/Resources"
          cp "target/universal/${{ matrix.app }}" "${app_bundle}/Contents/MacOS/${{ matrix.app }}"
          chmod +x "${app_bundle}/Contents/MacOS/${{ matrix.app }}"
          cat > "${app_bundle}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ matrix.app }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.offlineapps.${{ matrix.app }}</string>
              <key>CFBundleName</key>
              <string>${{ matrix.app }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          if command -v hdiutil >/dev/null 2>&1; then
            hdiutil create -volname "${{ matrix.app }}" -srcfolder "${app_bundle}" -ov -format UDZO "${abs_pkg_dir}/${{ matrix.app }}-0.1.0-macos.dmg" || true
          fi
          rm -rf "${stage_dir}"

          # Compute SHA-256 for all artifacts
          cd "${abs_pkg_dir}"
          for f in *; do
            if [ -f "$f" ] && [ "${f##*.}" != "sha256" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "$f" > "$f.sha256"
              fi
            fi
          done

      - name: Upload ${{ matrix.app }} macOS Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-macos
          path: dist-packages/${{ matrix.app }}/
          retention-days: 90

  build-android:
    name: Build Android (${{ matrix.app }})
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Package Standalone Android App
        run: |
          chmod +x scripts/package-mobile.sh
          mkdir -p "dist/android/${{ matrix.app }}"
          ./scripts/package-mobile.sh "0.1.0" "dist/android/${{ matrix.app }}" "${{ matrix.app }}"
          mkdir -p "dist-packages/${{ matrix.app }}"
          cp -f dist/android/${{ matrix.app }}/* "dist-packages/${{ matrix.app }}/" 2>/dev/null || true
        shell: bash

      - name: Upload ${{ matrix.app }} Android Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-android
          path: dist-packages/${{ matrix.app }}/
          retention-days: 90

  build-ios:
    name: Build iOS (${{ matrix.app }})
    needs: setup
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.setup.outputs.apps) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Rust Toolchain & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Package Standalone iOS Bundle
        run: |
          chmod +x scripts/package-mobile.sh
          mkdir -p "dist/ios/${{ matrix.app }}"
          ./scripts/package-mobile.sh "0.1.0" "dist/ios/${{ matrix.app }}" "${{ matrix.app }}"
          mkdir -p "dist-packages/${{ matrix.app }}"
          cp -f dist/ios/${{ matrix.app }}/* "dist-packages/${{ matrix.app }}/" 2>/dev/null || true
        shell: bash

      - name: Upload ${{ matrix.app }} iOS Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-ios
          path: dist-packages/${{ matrix.app }}/
          retention-days: 90
