name: Reusable Standalone Application Release Pipeline

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
        description: "Application crate directory name (e.g. pro-av-editor)"
      app_display_name:
        required: true
        type: string
        description: "Human-readable application name"
      version:
        required: false
        type: string
        default: "0.1.0"
        description: "Release version tag"

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x64
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-arm64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
            use_cross: false
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_suffix: macos-x64
            use_cross: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libasound2-dev

      - name: Build Svelte Desktop UI
        run: |
          if [ -d "apps/${{ inputs.app_name }}/ui" ]; then
            cd "apps/${{ inputs.app_name }}/ui"
            npm ci || npm install
            npm run build
          fi
        shell: bash

      - name: Build Application Binary (Standard)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p ${{ inputs.app_name }}

      - name: Verify Desktop Binary Self-Test & Embedded UI
        if: "!matrix.use_cross"
        shell: bash
        run: |
          bin_name="${{ inputs.app_name }}"
          [ "${{ runner.os }}" = "Windows" ] && bin_name="${bin_name}.exe"
          src_bin="target/${{ matrix.target }}/release/${bin_name}"
          echo "Running live GUI & IPC self-test on ${src_bin}..."
          "./${src_bin}" --self-test

      - name: Install cross-rs
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Application Binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p ${{ inputs.app_name }}

      - name: Package Desktop Artifacts
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact_suffix }}/stage/ui"
          bin_name="${{ inputs.app_name }}"
          [ "${{ runner.os }}" = "Windows" ] && bin_name="${bin_name}.exe"
          
          src_bin="target/${{ matrix.target }}/release/${bin_name}"
          if [ -f "${src_bin}" ]; then
            cp "${src_bin}" "dist/${{ matrix.artifact_suffix }}/"
            cp "${src_bin}" "dist/${{ matrix.artifact_suffix }}/stage/"
            if [ -d "apps/${{ inputs.app_name }}/ui/dist" ]; then
              cp -r "apps/${{ inputs.app_name }}/ui/dist/"* "dist/${{ matrix.artifact_suffix }}/stage/ui/" || true
            fi
            cat <<EOF > "dist/${{ matrix.artifact_suffix }}/stage/README-PORTABLE.txt"
          ${{ inputs.app_display_name }} v${{ inputs.version }} (${{ matrix.artifact_suffix }})
          ========================================================================
          - Launch Desktop GUI: Double-click ${bin_name} (or run ./${bin_name})
          - Run Self-Test Gate: ./${bin_name} --self-test
          - Headless IPC Mode:  ./${bin_name} --headless-server
          - CLI Diagnostics:    ./${bin_name} --cli
          EOF
            cd "dist/${{ matrix.artifact_suffix }}"
            sha256sum "${bin_name}" > "${bin_name}.sha256"
            zip_name="${{ inputs.app_name }}-v${{ inputs.version }}-${{ matrix.artifact_suffix }}-portable.zip"
            if command -v zip >/dev/null 2>&1; then
              (cd stage && zip -r "../${zip_name}" .)
            elif command -v 7z >/dev/null 2>&1; then
              (cd stage && 7z a -tzip "../${zip_name}" .)
            fi
            if [ -f "${zip_name}" ]; then
              sha256sum "${zip_name}" > "${zip_name}.sha256"
            fi
            rm -rf stage
          fi

          # Platform-specific native installers (MSI / DEB / RPM / AppImage / DMG / PKG)
          if [ "${{ runner.os }}" = "Windows" ]; then
            cat <<EOF > "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}-v${{ inputs.version }}.wxs"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
              <Product Id="*" Name="${{ inputs.app_display_name }}" Language="1033" Version="${{ inputs.version }}" Manufacturer="OfflineApps" UpgradeCode="{A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C5D}">
                  <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
                  <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
                  <MediaTemplate EmbedCab="yes" />
                  <Feature Id="ProductFeature" Title="${{ inputs.app_display_name }}" Level="1">
                      <ComponentRef Id="MainExecutable" />
                  </Feature>
                  <Directory Id="TARGETDIR" Name="SourceDir">
                      <Directory Id="ProgramFiles64Folder">
                          <Directory Id="INSTALLFOLDER" Name="${{ inputs.app_name }}">
                              <Component Id="MainExecutable" Guid="*">
                                  <File Id="AppExe" Source="dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}.exe" KeyPath="yes" />
                              </Component>
                          </Directory>
                      </Directory>
                  </Directory>
              </Product>
          </Wix>
          EOF
            if command -v candle.exe >/dev/null 2>&1 && command -v light.exe >/dev/null 2>&1; then
              candle.exe "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}-v${{ inputs.version }}.wxs" -o "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}.wixobj" || true
              light.exe "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}.wixobj" -o "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}-v${{ inputs.version }}-${{ matrix.artifact_suffix }}.msi" || true
              rm -f "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}.wixobj" "dist/${{ matrix.artifact_suffix }}/"*.wixpdb || true
            fi
          elif [ "${{ runner.os }}" = "Linux" ] && [ -f "${src_bin}" ]; then
            deb_arch="amd64"
            [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && deb_arch="arm64"
            deb_root="dist/${{ matrix.artifact_suffix }}/deb_stage"
            mkdir -p "${deb_root}/DEBIAN" "${deb_root}/usr/bin"
            cp "${src_bin}" "${deb_root}/usr/bin/${{ inputs.app_name }}"
            chmod 755 "${deb_root}/usr/bin/${{ inputs.app_name }}"
            cat <<EOF > "${deb_root}/DEBIAN/control"
          Package: ${{ inputs.app_name }}
          Version: ${{ inputs.version }}
          Section: utils
          Priority: optional
          Architecture: ${deb_arch}
          Maintainer: Offline Apps Engineering <maintainers@offlineapps.local>
          Description: ${{ inputs.app_display_name }} (100% Offline Standalone Desktop Suite)
          EOF
            dpkg-deb --build "${deb_root}" "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}_${{ inputs.version }}_${deb_arch}.deb" || true
            rm -rf "${deb_root}"
          elif [ "${{ runner.os }}" = "macOS" ] && [ -f "${src_bin}" ]; then
            app_bundle="dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}.app"
            mkdir -p "${app_bundle}/Contents/MacOS" "${app_bundle}/Contents/Resources"
            cp "${src_bin}" "${app_bundle}/Contents/MacOS/${{ inputs.app_name }}"
            chmod +x "${app_bundle}/Contents/MacOS/${{ inputs.app_name }}"
            cat <<EOF > "${app_bundle}/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ inputs.app_name }}</string>
              <key>CFBundleIdentifier</key>
              <string>com.offlineapps.${{ inputs.app_name }}</string>
              <key>CFBundleName</key>
              <string>${{ inputs.app_display_name }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ inputs.version }}</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
            hdiutil create -volname "${{ inputs.app_name }}" -srcfolder "${app_bundle}" -ov -format UDZO "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}-v${{ inputs.version }}-${{ matrix.artifact_suffix }}.dmg" || true
            pkgbuild --root "${app_bundle}" --identifier "com.offlineapps.${{ inputs.app_name }}" --version "${{ inputs.version }}" --install-location "/Applications/${{ inputs.app_name }}.app" "dist/${{ matrix.artifact_suffix }}/${{ inputs.app_name }}-v${{ inputs.version }}-${{ matrix.artifact_suffix }}.pkg" || true
            rm -rf "${app_bundle}"
          fi

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ matrix.artifact_suffix }}
          path: dist/${{ matrix.artifact_suffix }}/
          retention-days: 30

  build-mobile:
    name: Build Mobile (Android APK & iOS Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Setup Android SDK, Licenses & Debug Keystore
        run: |
          flutter config --android-sdk "$ANDROID_HOME"
          flutter config --jdk-dir "$JAVA_HOME"
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "Pre-generating standard debug.keystore for APK signing..."
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi
        shell: bash

      - name: Cache Gradle Wrapper & Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/
            ~/.gradle/caches/
          key: ${{ runner.os }}-gradle-8.5-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.5-
            ${{ runner.os }}-gradle-

      - name: Pre-generate Official Flutter Gradle Wrapper Template
        run: |
          mkdir -p /tmp/flutter_tmpl_wrapper
          flutter create --platforms=android --org com.offlineapps --project-name tmpl_wrapper /tmp/flutter_tmpl_wrapper
          if [ -f /tmp/flutter_tmpl_wrapper/android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's/gradle-[0-9.]*-(all|bin)\.zip/gradle-8.5-bin.zip/g' /tmp/flutter_tmpl_wrapper/android/gradle/wrapper/gradle-wrapper.properties
            sed -i -E 's/networkTimeout=[0-9]+/networkTimeout=60000/g' /tmp/flutter_tmpl_wrapper/android/gradle/wrapper/gradle-wrapper.properties
            echo "Updated /tmp/flutter_tmpl_wrapper/android/gradle/wrapper/gradle-wrapper.properties:"
            cat /tmp/flutter_tmpl_wrapper/android/gradle/wrapper/gradle-wrapper.properties
          fi
          echo "Template Gradle wrapper generated at /tmp/flutter_tmpl_wrapper"
          ls -la /tmp/flutter_tmpl_wrapper/android
          ls -la /tmp/flutter_tmpl_wrapper/android/gradle/wrapper/
        shell: bash

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Run Mobile Packaging Script
        run: |
          chmod +x scripts/package-mobile.sh
          ./scripts/package-mobile.sh "${{ inputs.version }}" "dist/mobile" "${{ inputs.app_name }}"
          echo "Generated Mobile artifacts:"
          ls -la "dist/mobile/"
          if [ -d "apps/${{ inputs.app_name }}/mobile" ]; then
            test -f "dist/mobile/${{ inputs.app_name }}-${{ inputs.version }}.apk" || { echo "CRITICAL: APK was not generated!"; exit 1; }
          fi
        shell: bash

      - name: Upload Mobile Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-mobile
          path: dist/mobile/
          retention-days: 30

  publish-release:
    name: Publish Release & Generate CycloneDX SBOM
    needs: [build-desktop, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --package ${{ inputs.app_name }} --format json --output-pattern "${{ inputs.app_name }}-sbom.json"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ inputs.app_display_name }} v${{ inputs.version }}"
          tag_name: "${{ inputs.app_name }}-v${{ inputs.version }}"
          files: |
            ${{ inputs.app_name }}-*/*
            ${{ inputs.app_name }}-sbom.json
          draft: false
          prerelease: false
          generate_release_notes: true

